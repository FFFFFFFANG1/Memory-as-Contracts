[project]
name = "memory-as-contracts"
version = "0.1.0"
description = "Contract layer for memory-mediated agent behavior."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.14.3",
    "func-timeout>=4.3.5",
    "mem0ai>=2.0.7",
    "numpy>=2.4.6",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
    "tqdm>=4.67.3",
    "typer>=0.12.0",
]

[project.scripts]
mac = "memory_as_contracts.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-m", "not live_llm"]
markers = [
    "live_llm: tests that call the configured live LLM endpoint",
]
